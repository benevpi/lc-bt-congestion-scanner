#
# Project configuration for the BLE Spectrum Monitor firmware.
# Derived from the nRF Connect SDK peripheral_uart sample.

# --- Bluetooth core ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="BLE-SpectrumMon"
CONFIG_BT_DEVICE_APPEARANCE=0

# Nordic UART Service (NUS)
CONFIG_BT_NUS=y

# Larger ATT MTU so a full sweep JSON fits in as few notifications as possible.
# Data length / PHY update help the larger MTU actually take effect.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_GATT_CLIENT=n

# Allow the application to drive the MTU exchange.
CONFIG_BT_GATT_DYNAMIC_DB=y

# --- MPSL (needed later for Option A timeslot scanning) ---
# Enabled now so the upgrade path does not require a config change.
CONFIG_MPSL=y

# --- System / threading ---
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- Logging over the debug UART ---
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_USE_SEGGER_RTT=n

# --- C library ---
# Use the SDK default (picolibc), which supports snprintf with %lld and strtol
# as used in main.c. Do not force minimal libc here.
